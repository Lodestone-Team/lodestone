# Lodestone Launcher has its own workspace and lockfile, so the core's CI does not
# build GPUI and GPUI's dependencies stay out of the root Cargo.lock.
[workspace]
members = ["crates/launcher-core", "crates/lodestone-launcher"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0"
authors = ["Lodestone Team"]
publish = false

[workspace.dependencies]
# GPUI from Zed's latest stable release, v1.27.0. Bump `rev` together with the
# `[patch.crates-io]` entries below, which mirror Zed's own at the same tag.
gpui = { git = "https://github.com/zed-industries/zed", rev = "c84af5b99cbc366d675064e52b23664a015b6e35", default-features = false }
gpui_platform = { git = "https://github.com/zed-industries/zed", rev = "c84af5b99cbc366d675064e52b23664a015b6e35", default-features = false }
# Zed's HTTP client: the `HttpClient` trait and its reqwest implementation (rustls with
# the platform verifier), from the same rev as GPUI.
http_client = { git = "https://github.com/zed-industries/zed", rev = "c84af5b99cbc366d675064e52b23664a015b6e35" }
reqwest_client = { git = "https://github.com/zed-industries/zed", rev = "c84af5b99cbc366d675064e52b23664a015b6e35" }

launcher-core = { path = "crates/launcher-core" }

# Third-party crates. Each resolves to the version in Zed v1.27.0's Cargo.lock, and
# uses the requirement and features Zed declares where Zed declares it.
anyhow = "1.0.86"
base64 = "0.22"
# Local dates for worlds, backups and screenshots; already in Zed's tree through GPUI.
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std"] }
dirs = "6.0"
futures = "0.3.34"
md-5 = "0.10"
# WebP and GIF read Modrinth's project icons; GPUI enables them too.
image = { version = "0.25.1", default-features = false, features = ["png", "jpeg", "webp", "gif"] }
libc = "0.2"
# Parses Modrinth's project descriptions; the launcher renders the events itself. Zed's
# requirement and features (no HTML writer).
pulldown-cmark = { version = "0.13.0", default-features = false }
# Zed's requirement and features.
regex = { version = "1.5", default-features = false, features = ["std", "perf"] }
rand = { version = "0.9", default-features = false, features = ["std", "std_rng", "os_rng"] }
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = { version = "1.0.144", features = ["preserve_order", "raw_value"] }
sha1 = "0.10.6"
sha2 = "0.10"
tempfile = "3.20.0"
thiserror = "2.0.12"
tiny_http = "0.12"
# Moving deleted instances to the Trash: Zed's fork, at the rev Zed's `fs` crate uses.
trash = { git = "https://github.com/zed-industries/trash-rs", rev = "41c6c800d884a89351f3b8856d12894cccee261d" }
url = "2.2"
uuid = { version = "1.1", features = ["serde"] }
# Extracting natives from library jars. Zed locks zip 0.6.6 (through webrtc-sys-build);
# only the deflate method is enabled, which is what Mojang's native jars use.
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }

# The Minecraft and Modrinth logic shared with Lodestone Core. Its `zip` feature (reading
# and writing .mrpack files and jars) is off: it needs zip 9, and Zed only locks zip 0.6.
lodestone_minecraft = { path = "../crates/lodestone-minecraft", default-features = false }

# The same patches Zed applies at v1.27.0, limited to crates in GPUI's tree.
[patch.crates-io]
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
calloop = { git = "https://github.com/zed-industries/calloop", rev = "3759371fee14c40066d64777e2a36b6ffcc22590" }
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
khronos-egl = { git = "https://github.com/zed-industries/khronos-egl", rev = "42214b36347b108fd9630ca6254b96dde59e04fe" }
windows-capture = { git = "https://github.com/zed-industries/windows-capture.git", rev = "f0d6c1b6691db75461b732f6d5ff56eed002eeb9" }

# Optimise the dependencies that do heavy work at runtime even in debug builds. The
# list follows Zed's own `[profile.dev.package]` (resvg, taffy, serde_json and the
# proc-macro crates), plus usvg and tiny-skia: unoptimised, they take about four
# seconds to rasterize the Play tab's artwork. sha1 is at the end.
[profile.dev.package]
gpui_macros = { opt-level = 3 }
derive_refineable = { opt-level = 3 }
quote = { opt-level = 3 }
syn = { opt-level = 3 }
proc-macro2 = { opt-level = 3 }
taffy = { opt-level = 3 }
resvg = { opt-level = 3 }
usvg = { opt-level = 3 }
tiny-skia = { opt-level = 3 }
tiny-skia-path = { opt-level = 3 }
serde_json = { opt-level = 3 }
# Hashing game files ("Verify game files", and files the install records don't vouch
# for) is about ten times slower unoptimised.
sha1 = { opt-level = 3 }
digest = { opt-level = 3 }
block-buffer = { opt-level = 3 }
