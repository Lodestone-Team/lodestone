[package]
name = "launcher-core"
description = "Lodestone Launcher's accounts, sign-in and data storage, without GPUI"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
flate2.workspace = true
chrono.workspace = true
dirs.workspace = true
futures.workspace = true
http_client.workspace = true
http_client_tls.workspace = true
image.workspace = true
launcher-control.workspace = true
libc.workspace = true
lodestone_connect.workspace = true
lodestone_minecraft.workspace = true
lodestone_trace.workspace = true
md-5.workspace = true
pulldown-cmark.workspace = true
rand.workspace = true
regex.workspace = true
reqwest.workspace = true
reqwest_client.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tiny_http.workspace = true
trash.workspace = true
tungstenite.workspace = true
url.workspace = true
uuid.workspace = true
zip.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true
# tests/lan_worlds.rs runs Lodestone Connect's in-process introduction service
# (crates/lodestone-connect/tests/support/fake_service.rs). Already in the lockfile,
# through lodestone_connect's `host` feature.
futures-util = "0.3.34"
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tokio-tungstenite = { version = "0.28.0", default-features = false, features = ["handshake"] }
