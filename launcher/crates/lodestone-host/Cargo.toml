[package]
name = "lodestone-host"
description = "Lodestone Host: runs a Lodestone Core on this computer and manages its servers"
# Its own version: Lodestone Host carries on from the Tauri Host (0.5.1), which it
# replaces. publish_release.py --product host reads it for the app and installer.
version = "0.6.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "lodestone-host"
path = "src/main.rs"

[features]
default = ["runtime-shaders"]
# Compile GPUI's Metal shaders when the app starts, as the launcher does, so the Host
# builds with only the Command Line Tools.
runtime-shaders = ["gpui_platform/runtime_shaders"]
# `--screenshot <file.png>`: renders the window offscreen, for development.
screenshot = ["gpui_platform/test-support", "lodestone-ui/screenshot"]

[dependencies]
anyhow.workspace = true
# Reads the sign-in token's expiry (`session::token_expiry`).
base64.workspace = true
chrono.workspace = true
dirs.workspace = true
futures.workspace = true
gpui.workspace = true
gpui_platform = { workspace = true, features = ["font-kit"] }
http_client.workspace = true
launcher-core.workspace = true
# The introduction service's address, for the friend list (`friends.rs`).
lodestone_connect.workspace = true
lodestone-ui.workspace = true
# The console's regex search.
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
# the whitelist's UUIDs (`whitelist.rs`)
uuid.workspace = true
url.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui_platform = { workspace = true, features = ["wayland", "x11"] }

# The menu bar icon and the DEV Dock icon (`tray.rs`). Already in GPUI's tree, at the
# versions in Zed v1.27.0's lockfile; only the AppKit classes used are enabled.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.3"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSApplication",
    "NSButton",
    "NSControl",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSStatusBar",
    "NSStatusBarButton",
    "NSStatusItem",
    "NSView",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
    "std",
    "NSData",
    "NSGeometry",
    "NSObject",
    "NSString",
] }

[target.'cfg(windows)'.dependencies]
# One Host at a time (`single_instance.rs`), and the notification area icon
# (`tray_windows.rs`).
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Shell",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile.workspace = true
