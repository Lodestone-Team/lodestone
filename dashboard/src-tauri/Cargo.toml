[package]
name = "lodestone-client"
description = "Lodestone's Desktop Client"
default-run = "lodestone-client"
rust-version.workspace = true
authors.workspace = true
homepage.workspace = true
readme.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2.12.5", features = ["devtools", "tray-icon"] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-localhost = "2.4.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-updater = "2.14.0"
portpicker = "0.1.1"
lodestone_core = { path = "../../core" }
# See core/Cargo.toml: rustls needs an explicit default crypto provider.
rustls = { version = "0.23.40", default-features = false, features = ["std", "aws_lc_rs"] }
tokio = { version = "1.54.1", features = ["macros", "rt", "rt-multi-thread"] }
notify-rust = "4.18.2"
