name: Core - Build and Draft

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag the release with, leave empty to not make a release"
        required: false
        type: string
  workflow_call:
    inputs:
      version:
        description: "Version to tag the release with, leave empty to not make a release"
        required: false
        type: string
      ref:
        description: "Commit, branch or tag to check out (empty for the run's own)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  core-build-and-draft:
    # contents: write is needed to upload the binaries to the draft release.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            target: "x86_64-pc-windows-msvc"
            os: "windows"
            arch: "x86_64"
            postfix: ".exe"
          # Pinned (not ubuntu-latest): the binary is shipped in the ubuntu:24.04 image
          # (core/githubactions.Dockerfile), so the build host's glibc must not be newer.
          - platform: "ubuntu-24.04"
            target: "x86_64-unknown-linux-gnu"
            os: "linux"
            arch: "x86_64"
            postfix: ""
          # Requires actions/runner >= 2.327.1 (node24 actions), rustup, and glibc <= 2.39.
          - platform: "self-hosted"
            target: "aarch64-unknown-linux-gnu"
            os: "linux"
            arch: "aarch64"
            postfix: ""

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}

      # Installs the toolchain pinned in rust-toolchain.toml, with the matrix's target.
      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install --profile minimal --no-self-update
          rustup target add ${{ matrix.target }}

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: rust-cache
          shared-key: ${{ matrix.target }}-release-build
          key: workspace
          # Only main writes the cache that release builds restore.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Find Version (Linux, MacOS)
        id: find_version
        if: runner.os != 'Windows'
        run: |
          VERSION="v$(grep "^version" Cargo.toml | cut -d = -f 2 | sed -E "s/\"//g" | sed -E "s/ //g")"
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          FILENAME="lodestone_core_${{matrix.os}}_${{matrix.arch}}_${VERSION}${{matrix.postfix}}"
          echo "FILENAME=${FILENAME}" >> $GITHUB_ENV

      - name: Find Version (Windows)
        id: find_version_windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $VERSION = "v" + (Get-Content Cargo.toml | Select-String -Pattern "^version" | ForEach-Object { $_.ToString().Split("=")[1].Trim().Replace("`"", "") })
          echo "VERSION=$VERSION" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8
          $FILENAME = "lodestone_core_${{matrix.os}}_${{matrix.arch}}_$VERSION${{matrix.postfix}}"
          echo "FILENAME=$FILENAME" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8

      - name: Build Lodestone Core
        run: cargo build --locked --profile=github-release --target ${{ matrix.target }}

      - name: Rename File (Linux, MacOS)
        if: runner.os != 'Windows'
        run: |
          mv ./target/${{ matrix.target }}/github-release/lodestone_core${{ matrix.postfix }} ./${{ env.FILENAME }}

      - name: Rename File (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "::debug::$(ls)"
          Move-Item -Path "./target/${{ matrix.target }}/github-release/lodestone_core${{ matrix.postfix }}" -Destination "./${{ env.FILENAME }}"
          # for debugging
          echo "::debug::Listing files in current directory"
          echo "::debug::$(ls)"

      # Artifact names are unique per matrix leg (os, arch and version are in FILENAME).
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{env.FILENAME}}
          path: ./${{env.FILENAME}}

      - name: Draft Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: inputs.version
        with:
          files: ./${{env.FILENAME}}
          # The release's tag (release.yml drafted it), which may be newer than
          # Cargo.toml's version.
          tag_name: ${{ inputs.version }}
          draft: true
          prerelease: true
