name: Core - Cargo Test

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  core-cargo-test:
    strategy:
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # Installs the toolchain pinned in rust-toolchain.toml.
    - name: Install Rust toolchain
      shell: bash
      run: rustup toolchain install --profile minimal --no-self-update

    - name: Cache Dependencies
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        prefix-key: rust-cache
        shared-key: workspace-${{ matrix.target }}-debug-build

    - name: Cargo Test Backend
      run: cargo test --locked --no-fail-fast

  # Core without the `deno` feature (no macros, atoms or extensions), see core/README.md.
  core-cargo-test-no-deno:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    # Installs the toolchain pinned in rust-toolchain.toml (its components include clippy).
    - name: Install Rust toolchain
      shell: bash
      run: rustup toolchain install --profile minimal --no-self-update

    - name: Cache Dependencies
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        prefix-key: rust-cache
        shared-key: workspace-x86_64-unknown-linux-gnu-debug-build-no-deno

    - name: Cargo Build Backend without Deno
      run: cargo build --locked -p lodestone_core --no-default-features

    - name: Cargo Test Backend without Deno
      run: cargo test --locked --no-fail-fast -p lodestone_core --no-default-features

    - name: Clippy Backend without Deno
      run: cargo clippy --locked -p lodestone_core --no-default-features --all-targets
