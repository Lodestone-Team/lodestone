name: Core - Cargo Test

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: "Commit, branch or tag to check out (empty for the run's own)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  core-cargo-test:
    strategy:
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: ubuntu-latest
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
        ref: ${{ inputs.ref }}

    # Installs the toolchain pinned in rust-toolchain.toml.
    - name: Install Rust toolchain
      shell: bash
      run: rustup toolchain install --profile minimal --no-self-update

    - name: Cache Dependencies
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        prefix-key: rust-cache
        shared-key: workspace-${{ matrix.target }}-debug-build
        # Only main's caches reach every branch; a pull request's only reach itself,
        # and crowd the launcher's and Host's out of the repository's cache space.
        save-if: ${{ github.ref == 'refs/heads/main' }}

    - name: Cargo Test Backend
      run: cargo test --locked --no-fail-fast

    # Nothing in the workspace turns on the image crate's zstd feature yet (the core will,
    # when its backups become images), so its zstd tests (reading the core's objects in
    # place) run here on their own.
    - name: Cargo Test Images with zstd
      run: cargo test --locked --no-fail-fast -p lodestone_image --features zstd
