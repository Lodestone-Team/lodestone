name: Core - Clippy Check

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  core-clippy-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the toolchain pinned in rust-toolchain.toml (its components include clippy).
      - name: Install Rust toolchain
        shell: bash
        run: rustup toolchain install --profile minimal --no-self-update

      - name: Cache Dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          prefix-key: rust-cache
          shared-key: workspace-x86_64-unknown-linux-gnu-release-check

      - name: Run Clippy Check
        run: cargo clippy --locked --all-features --release
