[package]
name = "lodestone_image"
description = "Instance images: the one format Lodestone Core and Lodestone Launcher use for backups, snapshots, modpack history, what a server sends players, and sharing"
publish = false
rust-version.workspace = true
authors.workspace = true
homepage.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true

# Lodestone Launcher (launcher/) depends on this crate too, and its dependencies must be
# the crates and versions already in its lockfile (Zed stable's). So every requirement
# below is a version both lockfiles have, and nothing here is new to either of them.
# docs/instance-images.md is the format this crate implements.
#
# The store's zstd encoding (core only) will come behind an optional `zstd` feature when
# the store is added: zstd is only in the root lockfile, and an optional dependency is
# still written into every lockfile that can see it.
[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
# preserve_order, as both the core and the Launcher already have it: the v1 readers keep
# parts of old manifests as JSON values and write them back in their original order.
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.10.9"
thiserror = "2.0.17"
# Reads the Launcher's world backup zips and `.lodesnap` files (legacy readers). No
# compression feature of its own: deflate needs a flate2 backend, and each host already
# picks one (the core zlib-rs, the Launcher miniz_oxide), so naming either here would add a
# crate to the other's lockfile. Both hosts enable zip's deflate; a build without it reports
# deflated entries as unreadable zips rather than misreading them.
zip = { version = "9.0.5", default-features = false }

[dev-dependencies]
sha1 = "0.10.6"
# The tests read deflated zips, with the backend the root workspace already has.
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }
