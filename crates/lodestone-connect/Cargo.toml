[package]
name = "lodestone_connect"
description = "Lodestone Connect: a direct, encrypted tunnel from a friend's launcher to a server shared with an invite link (UDP hole punching, then QUIC)"
publish = false
rust-version.workspace = true
authors.workspace = true
homepage.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true

# Lodestone Core uses the `host` feature, and Lodestone Launcher (launcher/) both `join`
# and `host` (it shares LAN worlds with friends). The launcher's dependencies must be
# crates and versions in Zed stable's Cargo.lock, so the requirements below are the
# lowest versions both lockfiles have, and the crates only a host needs
# (tokio-tungstenite) are behind `host`. Certificates are made with `ring` (cert.rs).
[dependencies]
# Static X25519 for pairing (ring only has ephemeral keys). Already built into both the
# launcher (through rustls) and the core, at these versions.
aws-lc-rs = { version = "1.18.1", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
socket2 = { version = "0.6.5", features = ["all"] }
subtle = "2.6.1"
thiserror = "2.0.17"
tokio = { version = "1.52.1", features = ["rt", "net", "io-util", "time", "sync"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
url = "2.5.7"
webpki-roots = "1.0.10"
zeroize = "1.8.2"

# Host only.
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"], optional = true }
# 0.28 is the version in Zed's Cargo.lock (the launcher's); the core locks 0.29. Only
# their MSRV and header checks differ.
tokio-tungstenite = { version = ">=0.28.0, <0.30.0", default-features = false, features = ["handshake"], optional = true }

[dev-dependencies]
tokio = { version = "1.52.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }

[features]
default = []
# Sharing a server: makes the certificate, registers invites and waits for joins.
host = ["dep:tokio-tungstenite", "dep:futures-util", "tokio/macros"]
# Joining a shared server with an invite link.
join = []

[[example]]
name = "connect"
required-features = ["host", "join"]

[[test]]
name = "loopback"
required-features = ["host", "join"]

[[test]]
name = "friends"
required-features = ["host", "join"]
