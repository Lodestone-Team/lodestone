[package]
name = "lodestone_connect"
description = "Lodestone Connect: a direct, encrypted tunnel from a friend's launcher to a server shared with an invite link (UDP hole punching, then QUIC)"
publish = false
rust-version.workspace = true
authors.workspace = true
homepage.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true

# Lodestone Core uses the `host` feature and Lodestone Launcher (launcher/) the `join`
# feature. The launcher's dependencies must be crates and versions in Zed stable's
# Cargo.lock, so the requirements below are the lowest versions both lockfiles have, and
# the crates only a host needs (rcgen, tokio-tungstenite) are behind `host`.
[dependencies]
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
ring = "0.17.14"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.10.9"
socket2 = { version = "0.6.5", features = ["all"] }
subtle = "2.6.1"
thiserror = "2.0.17"
tokio = { version = "1.52.1", features = ["rt", "net", "io-util", "time", "sync"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12"] }
tracing = { version = "0.1.44", default-features = false, features = ["std"] }
url = "2.5.7"
webpki-roots = "1.0.10"

# Host only.
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"], optional = true }
rcgen = { version = "0.14.10", default-features = false, features = ["ring"], optional = true }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["handshake"], optional = true }

[dev-dependencies]
tokio = { version = "1.52.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal"] }

[features]
default = []
# Sharing a server: makes the certificate, registers invites and waits for joins.
host = ["dep:rcgen", "dep:tokio-tungstenite", "dep:futures-util", "tokio/macros"]
# Joining a shared server with an invite link.
join = []

[[example]]
name = "connect"
required-features = ["host", "join"]

[[test]]
name = "loopback"
required-features = ["host", "join"]
