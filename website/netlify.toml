# www.lodestone.cc: the Lodestone Launcher landing page at /, and the Lodestone
# Core web dashboard at /core. See README.md next to this file.
#
# Netlify reads this file only for a site whose Base directory is `website`, so
# other Netlify sites built from this repository (such as Storybook) keep their
# own settings. Paths below are relative to `website/`; the whole repository is
# still checked out, so the build can reach ../dashboard.

[build]
  command = "node build.mjs"
  publish = "dist"

[build.environment]
  # dashboard/package.json needs Node 24.22.1 or later
  NODE_VERSION = "24"

# The dashboard used to be served from the root. Send its old addresses to
# /core, keeping the query string (Core links carry ?address=&port=...).
[[redirects]]
  from = "/first_setup"
  to = "/core/first_setup"
  status = 301

[[redirects]]
  from = "/login/*"
  to = "/core/login/:splat"
  status = 301

[[redirects]]
  from = "/dashboard/*"
  to = "/core/dashboard/:splat"
  status = 301

[[redirects]]
  from = "/settings/*"
  to = "/core/settings/:splat"
  status = 301

# The dashboard is a single-page app: any /core path that isn't a file is its
# index.html, and react-router takes it from there.
[[redirects]]
  from = "/core/*"
  to = "/core/index.html"
  status = 200

[[headers]]
  for = "/core/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
