[workspace]

members = [
    "core", # lodestone_core
    "crates/lodestone-minecraft", # lodestone_minecraft, shared with launcher/
    "crates/lodestone-trace", # lodestone_trace, debug traces, shared with launcher/
    "crates/lodestone-connect", # lodestone_connect, Lodestone Connect tunnels, shared with launcher/
    "dashboard/src-tauri" #lodestone-host
]
# Build the client with `npm run tauri build` in dashboard/
default-members = ["core", "crates/lodestone-minecraft", "crates/lodestone-trace", "crates/lodestone-connect"]
resolver = "2"

[profile.github-release]
inherits = "release"
strip = true
opt-level = "s"
lto = "thin"
codegen-units = 1

[workspace.package]
version = "0.5.1"
homepage = "https://github.com/Lodestone-Team"
readme = "README.md"
edition = "2021"
license = "APGL-3.0"
authors = ["Lodestone Team"]
rust-version = "1.99.1"

